<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RabbitMQ MQTT PoC</title>
    <!-- MQTT.js from CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #f0f2f5;
        }

        h1 {
            color: #333;
        }

        #login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin-bottom: 20px;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input,
        select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex-grow: 1;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #board-container {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 20px;
            align-items: flex-start;
        }

        .server-column {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            width: 300px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s;
        }

        .column-header {
            padding: 15px;
            background: #fff;
            border-bottom: 2px solid #007bff;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-title {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
            word-break: break-all;
        }

        .close-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #dc3545;
        }

        .events-list {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #fafafa;
            border-radius: 0 0 8px 8px;
        }

        .event-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            font-size: 0.9em;
        }

        .timestamp {
            color: #888;
            font-size: 0.8em;
            display: block;
            margin-top: 4px;
        }

        #status-bar {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1>Multi-Server Event Stream (MQTT)</h1>

    <div id="login-container">
        <h3>Login</h3>
        <div id="login-form">
            <input type="text" id="username" placeholder="Enter Username (user1=org1, user2=org2)" required>

            <div style="display: flex; gap: 10px;">
                <select id="org-select">
                    <option value="" disabled selected>Select Organization</option>
                    <option value="org1">Organization 1</option>
                    <option value="org2">Organization 2</option>
                </select>

                <select id="type-select">
                    <option value="all">All Types</option>
                    <option value="gate">Gate</option>
                    <option value="manifest">Manifest</option>
                </select>
            </div>

            <button onclick="login()">Login & Connect</button>
        </div>
        <div id="login-error" style="color: red; margin-top: 10px; display: none;"></div>
    </div>

    <div id="app-content" class="hidden">
        <div id="status-bar" style="color: grey">Connecting...</div>

        <div id="board-container">
            <!-- Columns will be injected here -->
        </div>
    </div>

    <script>
        // Use sessionStorage instead of localStorage to ensure unique Client ID per tab (Session)
        // This allows simulating multiple devices for the same user by opening multiple tabs
        var myClientId = sessionStorage.getItem("my_mqtt_client_id");
        if (!myClientId) {
            // Generate valid client ID: {random-hex}
            // User ID will be prepended during login if needed, or we just trust this random one.
            // For this PoC, we'll keep it simple: "web-{random}"
            myClientId = "web-" + Math.random().toString(16).substr(2, 8);
            sessionStorage.setItem("my_mqtt_client_id", myClientId);
        }

        console.log("My Client ID (Base): " + myClientId);

        var currentUser = null;
        var jwtToken = null;
        var currentOrg = null;
        var currentType = null;

        async function login() {
            var usernameInput = document.getElementById("username");
            var orgSelect = document.getElementById("org-select");
            var typeSelect = document.getElementById("type-select");

            var username = usernameInput.value;
            var org = orgSelect.value;
            var type = typeSelect.value;

            var errorDiv = document.getElementById("login-error");
            var loginBtn = document.querySelector("button");

            if (!username) {
                showError("Username is required"); return;
            }
            if (!org) {
                showError("Please select an Organization"); return;
            }

            loginBtn.disabled = true;
            errorDiv.style.display = "none";

            try {
                // mock login to get JWT
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                if (response.ok) {
                    const data = await response.json();
                    jwtToken = data.token;
                    currentUser = username;
                    currentOrg = org;
                    currentType = type;

                    // Finalize Client ID with Username prefix for clarity in logs
                    // e.g. user1-web-a1b2c3d4
                    if (!myClientId.startsWith(username + "-")) {
                        var newClientId = username + "-" + myClientId;
                        // Store in session so it persists for this tab only
                        sessionStorage.setItem("my_mqtt_client_id", newClientId);
                        myClientId = newClientId;
                    }

                    console.log("Authenticated as " + username + ". Client ID: " + myClientId);

                    document.getElementById("login-container").classList.add("hidden");
                    document.getElementById("app-content").classList.remove("hidden");

                    connect();
                } else {
                    showError("Login failed: " + response.statusText);
                    loginBtn.disabled = false;
                }
            } catch (error) {
                console.error("Login error", error);
                showError("Login error: " + error.message);
                loginBtn.disabled = false;
            }

            function showError(msg) {
                errorDiv.innerText = msg;
                errorDiv.style.display = "block";
            }
        }

        function connect() {
            updateStatus("Connecting to MQTT...", "grey");

            const options = {
                clientId: myClientId,
                clean: false,
                username: currentUser,
                password: jwtToken,
                keepalive: 60,
                protocolVersion: 4,
                reconnectPeriod: 2000 // interval between two reconnections
            };

            const brokerUrl = 'ws://' + window.location.hostname + ':15675/ws';
            console.log("Attempting MQTT connection to:", brokerUrl);

            client = mqtt.connect(brokerUrl, options);

            client.on('connect', function (connack) {
                console.log("MQTT Client Connected!", connack);
                updateStatus("Connected (ID: " + myClientId + ")", "green");

                // Subscribe based on selection
                let topicToSubscribe;
                if (currentType === 'all') {
                    topicToSubscribe = `event/${currentOrg}/#`;
                } else {
                    topicToSubscribe = `event/${currentOrg}/${currentType}/#`;
                }

                const subscribeOptions = { qos: 0 };
                console.log("Subscribing to:", topicToSubscribe);

                client.subscribe(topicToSubscribe, subscribeOptions, (err, granted) => {
                    if (err) {
                        console.error("Subscription ERROR:", err);
                        handleAuthFailure("Subscription Denied: You are not authorized for " + currentOrg);
                    } else {
                        console.log("Subscription Success:", granted);
                    }
                });
            });

            client.on('message', function (topic, message) {
                try {
                    let event = JSON.parse(message.toString());
                    console.log("Received via " + topic, event);

                    let parts = topic.split('/');
                    if (parts.length >= 4) {
                        let msgOrg = parts[1];
                        let msgType = parts[2];
                        let msgId = parts[3];

                        if (msgOrg !== currentOrg && currentOrg) return;

                        processEvent(event, msgOrg, msgType, msgId);
                    }

                } catch (e) {
                    console.error("Failed to process message", e);
                }
            });

            client.on('reconnect', function () {
                updateStatus("Reconnecting...", "orange");
            });

            client.on('error', function (error) {
                console.error("MQTT Error: ", error);

                // RabbitMQ often closes the connection on auth failure, which might manifest as an error
                // If we get an error regarding "Connection closed" or similar, treating it as potential auth failure
                // is safer than infinite reconnect loop.
                if (error.message && (error.message.includes("closed") || error.message.includes("ended"))) {
                    // Could be auth failure
                }
                updateStatus("Error: " + error.message, "red");
            });

            client.on('close', function () {
                // If connection closes *unexpectedly* and we were recently connected, it might be auth denial
            });

            // Handle unexpected disconnection which might be auth-related (RabbitMQ kicks client)
            client.on('offline', function () {
                updateStatus("Offline", "red");
            });
        }

        function handleAuthFailure(msg) {
            console.warn("Handling Auth Failure:", msg);
            if (client) {
                client.end(true); // Force close, stop reconnecting
                client = null;
            }

            // Show Login Screen
            document.getElementById("app-content").classList.add("hidden");
            document.getElementById("login-container").classList.remove("hidden");

            // Show Error
            var errorDiv = document.getElementById("login-error");
            errorDiv.innerText = msg;
            errorDiv.style.display = "block";

            // Re-enable button
            document.querySelector("#login-form button").disabled = false;
        }

        function updateStatus(msg, color) {
            var statusDiv = document.getElementById("status-bar");
            statusDiv.innerText = msg;
            statusDiv.style.color = color;
        }

        function processEvent(event, org, type, id) {
            var columnId = `col-${org}-${type}-${id}`;
            var columnTitle = `${org.toUpperCase()} <br> ${type} <br> ${id}`;

            var column = document.getElementById(columnId);

            if (!column) {
                createColumn(columnId, columnTitle);
                column = document.getElementById(columnId);
            }

            var list = column.querySelector(".events-list");
            var newItem = document.createElement("div");
            newItem.className = "event-item";
            newItem.innerHTML = "<div><strong>Seq: " + event.sequence + "</strong></div>" +
                "<div>" + event.data + "</div>" +
                "<span class='timestamp'>" + event.timestamp + "</span>";

            list.insertBefore(newItem, list.firstChild);
        }

        function createColumn(columnId, title) {
            var container = document.getElementById("board-container");

            var col = document.createElement("div");
            col.className = "server-column";
            col.id = columnId;
            col.innerHTML = `
                <div class="column-header">
                    <div class="column-title">${title}</div>
                    <button class="close-btn" onclick="removeColumn('${columnId}')">&times;</button>
                </div>
                <div class="events-list"></div>
            `;

            container.appendChild(col);
        }

        function removeColumn(columnId) {
            var col = document.getElementById(columnId);
            if (col) col.remove();
        }

        window.removeColumn = removeColumn;
    </script>
</body>

</html>
