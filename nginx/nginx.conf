events {
    worker_connections 1024;
}

http {
    upstream spring_boot_backend {
        # Use least_conn to distribute traffic to less busy servers
        least_conn;
        
        # Point to the host machine ports (where Spring Boot is running)
        server host.docker.internal:8080 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8081 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8082 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8083 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8084 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8085 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8086 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8087 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8088 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8089 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://spring_boot_backend;
            
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeouts for fast failover detection
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 60s; # Keep alive
        }
    }
}
